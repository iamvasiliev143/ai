name: ai-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Агенты, навыки и ссылки документации
        run: npm run check:docs
